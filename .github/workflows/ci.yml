# ============================================================
# CI — Continuous Integration
# ============================================================
# TRIGGERS:
#   - Every push to any branch
#   - Every Pull Request targeting main
#
# JOBS:
#   1. Lint     → check code style and syntax
#   2. Test     → run tests on Node 16, 18, 20 in parallel
#
# CD will NOT start until this workflow passes on main.
# ============================================================
# test pipeline for CD — Continuous Deployment
name: CI - Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:

  # ------------------------------------------------------------
  # JOB 1: Lint
  # Checks code quality before wasting time running tests
  # ------------------------------------------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: node-18-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-18-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run ESLint
        run: npm run lint


  # ------------------------------------------------------------
  # JOB 2: Test (Matrix)
  # Runs tests on Node 16, 18, 20 in parallel
  # Only starts after lint passes
  # ------------------------------------------------------------
  test:
    name: "Test — Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        node-version: ["16", "18", "20"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: node-${{ matrix.node-version }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-${{ matrix.node-version }}-${{ runner.os }}-

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        if: matrix.node-version == '18'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
