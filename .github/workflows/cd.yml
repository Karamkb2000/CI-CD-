# ============================================================
# CD — Continuous Deployment
# ============================================================
# TRIGGER:
#   Runs automatically ONLY after CI passes on main.
#   If CI fails → CD never starts.
#
# FLOW:
#   CI passes on main
#        ↓
#   [1] Run tests again (fresh check before deploying)
#        ↓
#   [2] Deploy to STAGING  (automatic)
#        ↓
#   [3] Smoke test staging  (automated health check)
#        ↓
#   [4] Wait for MANUAL APPROVAL
#        ↓
#   [5] Deploy to PRODUCTION
# ============================================================

name: CD - Continuous Deployment

on:
  workflow_run:
    workflows: ["CI - Continuous Integration"]   # wait for CI to finish
    types:
      - completed
    branches:
      - main                                      # only on main branch

jobs:

  # ------------------------------------------------------------
  # GATE: Only continue if CI passed
  # If CI failed, all jobs below are skipped
  # ------------------------------------------------------------
  check-ci:
    name: Check CI Result
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: CI passed — proceeding with deployment
        run: |
          echo "CI passed on commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Starting deployment pipeline..."


  # ------------------------------------------------------------
  # JOB 1: Run Tests
  # Run tests one more time before touching any server
  # ------------------------------------------------------------
  test:
    name: Run Tests Before Deploy
    runs-on: ubuntu-latest
    needs: check-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: node-18-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-18-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests
        run: npm test


  # ------------------------------------------------------------
  # JOB 2: Deploy to Staging
  # Automatic — no approval needed
  # ------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: node-18-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-18-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Deploy to Staging
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          echo "Deploying to STAGING..."
          echo "Version: ${{ github.event.workflow_run.head_sha }}"
          # Real command would be:
          # ssh -i $DEPLOY_KEY user@$STAGING_HOST "cd /app && git pull && npm ci && pm2 restart app"
          echo "Staging deploy complete!"


  # ------------------------------------------------------------
  # JOB 3: Smoke Test Staging
  # Quick automated check that staging is alive after deploy
  # ------------------------------------------------------------
  smoke-test:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Health check
        run: |
          echo "Checking staging health..."
          # Real command: curl -f https://staging.my-app.com/health || exit 1
          echo "GET /health → 200 OK"
          echo "Staging is healthy — ready for review"


  # ------------------------------------------------------------
  # JOB 4: Deploy to Production
  # PAUSES and waits for a human to approve in GitHub UI
  # Go to: Actions → CD run → Review deployments → Approve
  # ------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-test

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: node-18-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-18-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Deploy to Production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          echo "======================================"
          echo "  DEPLOYING TO PRODUCTION"
          echo "  Approved by: ${{ github.actor }}"
          echo "  Version:     ${{ github.event.workflow_run.head_sha }}"
          echo "======================================"
          # Real command:
          # ssh -i $DEPLOY_KEY user@$PROD_HOST "cd /app && git pull && npm ci && pm2 restart app"
          echo "Production deploy complete!"

      - name: Deployment summary
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ github.event.workflow_run.head_sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Approved by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://my-app.com |" >> $GITHUB_STEP_SUMMARY
