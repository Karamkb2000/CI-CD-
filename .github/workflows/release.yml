# ============================================================
# RELEASE WORKFLOW
# ============================================================
# TRIGGER: Push a version tag like v1.0.0, v2.3.1
#
# HOW TO TRIGGER (from terminal):
#   git tag v2.0.0
#   git push origin v2.0.0
#
# WHAT IT DOES:
#   1. Run full test suite
#   2. Build the app
#   3. Create a GitHub Release automatically
#   4. Attach build artifacts to the release
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*.*.*"   # matches v1.0.0, v2.3.1, v10.0.0 etc.

jobs:

  # ------------------------------------------------------------
  # JOB 1: Validate the tag format
  # ------------------------------------------------------------
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest

    steps:
      - name: Check tag format
        run: |
          TAG="${{ github.ref_name }}"
          echo "Tag: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format! Use: v1.2.3"
            exit 1
          fi
          echo "Tag format is valid!"


  # ------------------------------------------------------------
  # JOB 2: Run Tests
  # ------------------------------------------------------------
  test:
    name: Run Tests
    needs: validate-tag
    uses: ./.github/workflows/reusable-test.yml
    with:
      node-version: "18"
      upload-coverage: true


  # ------------------------------------------------------------
  # JOB 3: Build & Package
  # ------------------------------------------------------------
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-deps
        with:
          path: node_modules
          key: node-18-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --production   # skip devDependencies for production build

      - name: Set version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          echo "Building version: $VERSION"
          # Update package.json version to match the tag
          npm version ${VERSION#v} --no-git-tag-version

      - name: Create release package
        run: |
          mkdir -p dist
          tar -czf dist/app-${{ github.ref_name }}.tar.gz \
            app.js \
            package.json \
            node_modules/
          echo "Package created: dist/app-${{ github.ref_name }}.tar.gz"
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
          retention-days: 30


  # ------------------------------------------------------------
  # JOB 4: Create GitHub Release
  # Automatically creates a release page with:
  #   - Release notes
  #   - The .tar.gz build artifact attached
  # ------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    # This permission is required to create releases
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Fetch full history for changelog

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist/

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Get all commits since the last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -10)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## What's New in ${{ github.ref_name }}

            ${{ steps.changelog.outputs.commits }}

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            dist/app-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
